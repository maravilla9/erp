<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ValleProject | Semana 6</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --verde:#07B708; --verde-d:#058A06; --tinta:#1B2236; --suave:#6B7280; --borde:#E4E8F0;
  --naranja:#F07B00; --rosa:#D6338A; --turq:#0E9C94; --morado:#7B2FD0; --amarillo:#E0A100; --azul:#2E7DD7; --rojo:#D62828;
  --noche:#0B1426; --noche2:#121F38; --noche3:#1B2B4B; --cielo:#F3F6FB;
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:Poppins,system-ui,sans-serif;background:var(--cielo);color:var(--tinta);font-size:14px;min-height:100vh}
button{font-family:inherit}
.wrap{max-width:1180px;margin:0 auto;padding:8px 14px}
header.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
header.top img{height:30px}
.prog{display:flex;align-items:center;gap:10px;flex:1;min-width:200px}
.timer{font-weight:700;background:#fff;border-radius:10px;padding:4px 10px;box-shadow:0 2px 8px rgba(0,0,0,.06);font-variant-numeric:tabular-nums}
.bar{flex:1;height:8px;background:#E1E6EE;border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--verde),var(--turq),var(--azul));transition:width .7s}
.badges{display:flex;gap:6px}
.badge{font-size:11px;font-weight:700;padding:4px 10px;border-radius:99px;color:#fff}
.b1{background:var(--rosa)}.b2{background:var(--morado)}
.steps{display:none;gap:6px;margin:7px 0}
.steps span{flex:1;text-align:center;font-size:11px;font-weight:700;padding:4px;border-radius:9px;background:#E3E8F0;color:#8A93A6;transition:all .3s}
.steps span.on{background:var(--morado);color:#fff;box-shadow:0 4px 14px rgba(123,47,208,.35)}
.steps span.ok{background:#DDF5DD;color:var(--verde-d)}
footer{text-align:center;color:var(--suave);font-size:12px;margin:8px 0 4px}

/* ---------- login ---------- */
.login{position:relative;border-radius:22px;overflow:hidden;min-height:560px;display:flex;align-items:center;justify-content:center;background:radial-gradient(1200px 600px at 10% 10%,#2B1B6B 0,transparent 60%),radial-gradient(900px 500px at 90% 90%,#0E5E58 0,transparent 60%),var(--noche)}
.login canvas{position:absolute;inset:0;width:100%;height:100%}
.glass{position:relative;width:min(440px,92%);background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.18);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-radius:20px;padding:26px;color:#fff;box-shadow:0 30px 80px rgba(0,0,0,.45);animation:rise .7s cubic-bezier(.2,.8,.2,1)}
@keyframes rise{from{opacity:0;transform:translateY(30px) scale(.97)}to{opacity:1;transform:none}}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:22px}
.brand .lg{width:40px;height:40px;border-radius:12px;background:linear-gradient(135deg,var(--verde),var(--turq));display:flex;align-items:center;justify-content:center;font-size:20px;box-shadow:0 8px 20px rgba(7,183,8,.4)}
.glass p{color:#C9D3E8;margin:8px 0 14px;line-height:1.45}
.glass label{font-size:12px;color:#AFC0DA;font-weight:600}
.glass input{width:100%;margin:4px 0 12px;font:inherit;font-size:15px;padding:11px 13px;border-radius:12px;border:1px solid rgba(255,255,255,.22);background:rgba(255,255,255,.1);color:#fff;outline:none}
.glass input:focus{border-color:var(--verde);box-shadow:0 0 0 3px rgba(7,183,8,.25)}
.glass .tip{background:rgba(46,125,215,.18);border:1px solid rgba(46,125,215,.4);border-radius:12px;padding:8px 11px;font-size:12.5px;color:#D7E6FA;margin-bottom:12px}
.loading{margin-top:14px;display:none}
.loading .ln{display:flex;align-items:center;gap:8px;font-size:13px;color:#C9D3E8;opacity:0;transform:translateX(-8px);transition:all .3s;margin:3px 0}
.loading .ln.in{opacity:1;transform:none}
.loading .ln b{color:var(--verde)}
.lbar{height:6px;background:rgba(255,255,255,.12);border-radius:99px;overflow:hidden;margin-top:8px}
.lbar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--verde),#7CFC8A);transition:width .25s}

/* ---------- shell ERP ---------- */
.shell{display:grid;grid-template-columns:205px 1fr;background:#fff;border-radius:18px;overflow:hidden;box-shadow:0 18px 50px rgba(16,26,46,.12);overflow:clip;height:min(610px,calc(100vh - 118px));min-height:520px;animation:rise .6s cubic-bezier(.2,.8,.2,1)}
.side{overflow:clip;background:linear-gradient(180deg,var(--noche),#0F1C36);color:#fff;padding:14px 10px;display:flex;flex-direction:column;gap:4px}
.side .brand{font-size:17px;padding:2px 6px 10px}
.side .brand .lg{width:32px;height:32px;font-size:16px;border-radius:10px}
.nav{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:11px;color:#9FB0CC;font-size:13px;font-weight:600;cursor:pointer;border:1px solid transparent;transition:all .2s;background:none;text-align:left;width:100%}
.nav .ic{width:26px;height:26px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:14px;background:rgba(255,255,255,.06);flex:none}
.nav:hover{background:rgba(255,255,255,.06);color:#fff}
.nav.on{background:linear-gradient(90deg,rgba(7,183,8,.22),rgba(7,183,8,.05));color:#fff;border-color:rgba(7,183,8,.35)}
.nav.lock{opacity:.35;cursor:not-allowed}
.nav.lock::after{content:"🔒";margin-left:auto;font-size:11px}
.nav.glow{animation:glow 1.2s ease 2}
@keyframes glow{50%{box-shadow:0 0 0 3px rgba(7,183,8,.45),0 0 24px rgba(7,183,8,.5);color:#fff}}
.nav.target{animation:target 1.4s infinite}
@keyframes target{50%{background:rgba(123,47,208,.25)}}
.side .usr{margin-top:auto;display:flex;align-items:center;gap:8px;padding:8px;border-radius:12px;background:rgba(255,255,255,.06);font-size:12px}
.side .usr .av{width:30px;height:30px;border-radius:50%;background:linear-gradient(135deg,var(--morado),var(--rosa));display:flex;align-items:center;justify-content:center;font-weight:800}
.side .usr small{color:#8FA2C2;display:block}
.main{display:flex;flex-direction:column;min-width:0;min-height:0;overflow:clip;background:var(--cielo)}
.mbar{display:flex;align-items:center;gap:10px;padding:10px 16px;background:#fff;border-bottom:1px solid var(--borde)}
.mbar h3{margin:0;font-size:16px}
.mbar .crumb{color:var(--suave);font-size:12px}
.bell{margin-left:auto;position:relative;font-size:18px;cursor:default}
.bell b{position:absolute;top:-6px;right:-8px;background:var(--rojo);color:#fff;font-size:10px;border-radius:99px;padding:1px 5px;display:none}
.live{display:flex;align-items:center;gap:6px;font-size:11.5px;font-weight:700;color:var(--verde-d)}
.live i{width:8px;height:8px;border-radius:50%;background:var(--verde);animation:pl 1.4s infinite}
@keyframes pl{50%{box-shadow:0 0 0 6px rgba(7,183,8,0)}0%{box-shadow:0 0 0 0 rgba(7,183,8,.6)}}
.mission{margin:10px 16px 0;background:linear-gradient(135deg,#1B1446,#24124F);color:#fff;border-radius:14px;padding:10px 14px;position:relative;overflow:hidden}
.mission::after{content:"";position:absolute;right:-40px;top:-40px;width:140px;height:140px;border-radius:50%;background:radial-gradient(circle,rgba(123,47,208,.55),transparent 70%)}
.mission .mk{font-size:10.5px;font-weight:800;letter-spacing:.08em;color:#C9B3FF;text-transform:uppercase}
.mission h2{margin:2px 0 4px;font-size:16.5px}
.guia{background:rgba(255,255,255,.1);border-left:4px solid #5AA2F0;border-radius:10px;padding:6px 10px;font-size:12.8px;color:#DCE8FA;position:relative;z-index:1}
.guia b{color:#fff}
.view{flex:1;min-height:0;overflow:auto;padding:10px 16px 14px;position:relative}
.view.fade{animation:fd .4s ease}
@keyframes fd{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* ---------- componentes ---------- */
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.kpi{background:#fff;border:1px solid var(--borde);border-radius:14px;padding:10px 12px;position:relative;overflow:hidden}
.kpi small{color:var(--suave);font-weight:600;font-size:11.5px}
.kpi b{display:block;font-size:20px;margin-top:2px;font-variant-numeric:tabular-nums}
.kpi .tr{font-size:11px;font-weight:700}
.kpi::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--c,#07B708)}
.panel{background:#fff;border:1px solid var(--borde);border-radius:14px;padding:12px;margin-top:10px}
.panel h4{margin:0 0 8px;font-size:13.5px}
.grid2{display:grid;grid-template-columns:1.2fr 1fr;gap:10px}
.cat{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}
.mod{background:#fff;border:2px solid var(--borde);border-radius:14px;padding:10px;cursor:pointer;transition:all .2s;position:relative}
.mod:hover{transform:translateY(-2px);box-shadow:0 8px 18px rgba(16,26,46,.08)}
.mod .em{font-size:22px}
.mod b{display:block;font-size:13px;margin:4px 0 2px}
.mod small{color:var(--suave);font-size:11.5px;line-height:1.35;display:block}
.tg{position:absolute;top:10px;right:10px;width:36px;height:20px;border-radius:99px;background:#CDD3DE;transition:all .2s}
.tg::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;transition:all .2s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.mod.on{border-color:var(--verde);background:#F2FCF2}
.mod.on .tg{background:var(--verde)}.mod.on .tg::after{left:18px}
.mod.bad{border-color:var(--rojo);background:#FDF0F0}
.btn{font:inherit;font-weight:700;font-size:13.5px;border:0;border-radius:11px;padding:9px 16px;cursor:pointer;background:var(--verde);color:#fff;transition:transform .1s,background .2s,box-shadow .2s;box-shadow:0 6px 16px rgba(7,183,8,.25);display:inline-block;text-decoration:none;text-align:center}
.btn:hover{background:var(--verde-d)} .btn:active{transform:scale(.97)}
.btn:disabled{opacity:.45;cursor:not-allowed;box-shadow:none}
.btn.sec{background:#EEF1F6;color:var(--tinta);box-shadow:none}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:10px}
.msg{margin-top:10px;border-radius:12px;padding:9px 12px;font-size:13px;display:none}
.msg.ojo{display:block;background:#FDE8E8;color:#8E1B1B;border-left:5px solid var(--rojo)}
.msg.bien{display:block;background:#E3F7E3;color:#145A14;border-left:5px solid var(--verde)}
.why{font-style:italic;color:#6B7280;font-size:12.5px;margin-top:3px;line-height:1.45}
.cnt{font-weight:700;color:var(--morado);font-size:12.5px}
.fld{display:flex;flex-direction:column;gap:4px;margin-bottom:8px}
.fld label{font-size:11.5px;font-weight:700;color:var(--suave)}
.fld select{font:inherit;font-size:13.5px;padding:8px 10px;border-radius:10px;border:1.5px solid var(--borde);background:#fff;outline:none}
.fld select:focus{border-color:var(--morado)}
.crm{display:flex;flex-direction:column;gap:7px}
.cli{display:flex;align-items:center;gap:9px;border:1.5px solid var(--borde);border-radius:12px;padding:7px 9px;font-size:12.5px}
.cli .av{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;color:#fff;flex:none}
.cli small{color:var(--suave);display:block;font-size:11px}
.order{background:linear-gradient(135deg,#FFF7EC,#FFF);border:1.5px dashed var(--naranja);border-radius:12px;padding:8px 11px;font-size:12.8px;margin-bottom:8px}
/* mapa integración */
.netwrap{position:relative;background:radial-gradient(600px 300px at 50% 50%,#16294D,var(--noche));border-radius:14px;height:300px;overflow:hidden}
.netwrap svg{position:absolute;inset:0;width:100%;height:100%}
.node{position:absolute;transform:translate(-50%,-50%);background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.2);border-radius:12px;padding:6px 9px;color:#fff;font-size:11.5px;text-align:center;min-width:120px;transition:all .4s;backdrop-filter:blur(4px)}
.node b{display:block;font-size:12.5px}
.node .up{color:#7CFC8A;font-weight:700;font-size:11.5px;min-height:16px}
.node.hit{border-color:#7CFC8A;box-shadow:0 0 0 3px rgba(124,252,138,.25),0 0 30px rgba(124,252,138,.35);background:rgba(124,252,138,.12)}
.core{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:92px;height:92px;border-radius:50%;background:radial-gradient(circle,#2E7DD7,#13294B);display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;font-size:10px;font-weight:800;text-align:center;box-shadow:0 0 40px rgba(46,125,215,.6)}
.core .e{font-size:24px}
.core.beat{animation:beat .6s}
@keyframes beat{50%{transform:translate(-50%,-50%) scale(1.12);box-shadow:0 0 70px rgba(124,252,138,.8)}}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:8px;margin-top:8px}
.opt{text-align:left;border:2px solid var(--borde);background:#fff;border-radius:12px;padding:9px 12px;font:inherit;font-size:13.3px;cursor:pointer;transition:all .15s}
.opt:hover{border-color:var(--morado)}
.opt.pick{border-color:var(--morado);background:#EFE6FD;box-shadow:0 0 0 3px rgba(123,47,208,.13)}
.opt.pick::before{content:"👉 "}
.opt.sel{border-color:var(--verde);background:#EAF9EA}
/* tablas */
table.t{width:100%;border-collapse:collapse;font-size:12.8px}
table.t th{text-align:left;background:#F5F7FB;color:var(--suave);font-weight:700;font-size:11.5px;padding:7px 9px;border-bottom:1px solid var(--borde)}
table.t td{padding:7px 9px;border-bottom:1px solid #F0F2F6}
table.t tr.hl td{background:#FFF6E6}
table.t tr.dup td{background:#FDECEC}
.pill{display:inline-block;font-size:11px;font-weight:700;border-radius:99px;padding:2px 8px}
.pill.g{background:#DDF5DD;color:var(--verde-d)}.pill.r{background:#FDE2E2;color:var(--rojo)}.pill.a{background:#FFF1D6;color:#8A6200}
.alert{display:flex;gap:10px;align-items:flex-start;background:#FFF;border:1px solid #F5C2C2;border-left:5px solid var(--rojo);border-radius:12px;padding:9px 12px;animation:shk .5s}
@keyframes shk{20%{transform:translateX(-5px)}40%{transform:translateX(5px)}60%{transform:translateX(-3px)}80%{transform:translateX(3px)}}
.alert .e{font-size:22px}
/* toasts */
#toasts{position:fixed;right:16px;bottom:16px;display:flex;flex-direction:column-reverse;gap:8px;z-index:60;pointer-events:none}
.toast{background:var(--noche2);color:#fff;border-left:4px solid var(--verde);border-radius:12px;padding:9px 13px;font-size:12.5px;box-shadow:0 14px 30px rgba(0,0,0,.25);animation:tin .45s cubic-bezier(.2,.8,.2,1);max-width:300px}
.toast.out{animation:tout .4s forwards}
@keyframes tin{from{opacity:0;transform:translateX(40px)}to{opacity:1;transform:none}}
@keyframes tout{to{opacity:0;transform:translateX(40px)}}
/* resultado */
.cmp{display:grid;gap:8px}
.cmp .r{display:grid;grid-template-columns:200px 1fr 1fr;gap:10px;align-items:center;font-size:12.8px}
.cmp .h{font-weight:800;color:var(--suave);font-size:11.5px}
.cmp .x{background:#FDECEC;color:#8E1B1B;border-radius:10px;padding:7px 10px;font-weight:600}
.cmp .v{background:#E3F7E3;color:#145A14;border-radius:10px;padding:7px 10px;font-weight:700;opacity:0;transform:scale(.9);transition:all .5s}
.cmp .v.in{opacity:1;transform:none}
.cert{border:4px solid var(--verde);border-radius:18px;padding:16px;text-align:center;background:linear-gradient(180deg,#fff,#F2FBF2)}
.cert .nm{font-size:24px;font-weight:800;color:var(--morado);margin:4px 0}
.cert .meta{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;font-size:13px;margin-top:8px}
.cert .meta span{background:#fff;border-radius:99px;padding:5px 11px;box-shadow:0 1px 4px rgba(0,0,0,.08)}
.share{display:grid;grid-template-columns:repeat(auto-fit,minmax(115px,1fr));gap:8px;margin-top:10px}
.share .btn{font-size:13px;padding:9px;box-shadow:none}
.wa{background:#25D366}.fb{background:#1877F2}.xx{background:#111}.cp{background:var(--turq)}.st{background:var(--rosa)}
.chat{margin-top:10px;font-weight:700;color:var(--verde-d);text-align:center}
canvas#conf{position:fixed;inset:0;pointer-events:none;z-index:70}
.shake{animation:shk .45s}
@media (max-width:760px){
  body{font-size:13.5px}
  header.top .prog{order:3;flex-basis:100%}
  .shell{grid-template-columns:1fr;height:auto;min-height:0}
  .side{flex-direction:row;overflow-x:auto;padding:8px;gap:6px}
  .side .brand,.side .usr{display:none}
  .nav{flex:none;width:auto;padding:7px 9px;font-size:12px}
  .nav .ic{width:22px;height:22px}
  .view{overflow:visible}
  .kpis{grid-template-columns:1fr 1fr}
  .cat{grid-template-columns:1fr 1fr}
  .grid2{grid-template-columns:1fr}
  .netwrap{height:340px}
  .node{min-width:0;max-width:118px;font-size:10px;padding:4px 6px}
  #n_ventas{left:21%!important} #n_fin,#n_compras{left:79%!important}
  #toasts{top:8px;bottom:auto;left:8px;right:8px;flex-direction:column}
  .toast{max-width:none;font-size:12px;padding:7px 10px}
  .cmp .r{grid-template-columns:1fr 1fr}.cmp .r>span:first-child{grid-column:1/3;font-weight:700}
  .login{min-height:520px}
}
</style>
<style>
.nav .num{width:26px;height:26px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;background:rgba(255,255,255,.08);flex:none}
.nav.done .num{background:var(--verde);color:#fff}
.nav.done{color:#CFE8D0}
.team{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
.pf{background:#fff;border:2px solid var(--borde);border-radius:14px;padding:10px;cursor:pointer;transition:all .2s;display:flex;gap:10px;align-items:center;position:relative}
.pf:hover{transform:translateY(-2px);box-shadow:0 8px 18px rgba(16,26,46,.08)}
.pf .av{width:42px;height:42px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:20px;flex:none}
.pf b{display:block;font-size:13px}.pf small{color:var(--suave);font-size:11.5px;line-height:1.3;display:block}
.pf.on{border-color:var(--verde);background:#F2FCF2}
.pf.on::after{content:"✔";position:absolute;top:-8px;right:-8px;width:22px;height:22px;border-radius:50%;background:var(--verde);color:#fff;font-size:12px;font-weight:800;display:flex;align-items:center;justify-content:center}
.pf.bad{border-color:var(--rojo);background:#FDF0F0}
.chk{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.ck{display:flex;align-items:center;gap:9px;background:#fff;border:2px solid var(--borde);border-radius:12px;padding:9px 11px;cursor:pointer;font-size:13px;transition:all .2s}
.ck .bx{width:20px;height:20px;border-radius:6px;border:2px solid #B9C2CF;flex:none;display:flex;align-items:center;justify-content:center;font-size:12px;color:#fff;transition:all .2s}
.ck.on{border-color:var(--verde);background:#F2FCF2}.ck.on .bx{background:var(--verde);border-color:var(--verde)}.ck.on .bx::after{content:"✔"}
.ck.bad{border-color:var(--rojo);background:#FDF0F0}
.costs{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.prop{background:#fff;border:1px solid var(--borde);border-radius:14px;padding:10px 12px}
.prop h4{margin:0 0 6px;font-size:13.5px;display:flex;align-items:center;gap:6px}
.ci{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:6px 8px;border-radius:9px;font-size:12.8px;cursor:pointer;border:1.5px solid transparent;transition:all .2s;margin-bottom:4px;background:#F7F9FC}
.ci.on{border-color:var(--morado);background:#F2EAFE}
.ci .sw{width:30px;height:16px;border-radius:99px;background:#CDD3DE;position:relative;flex:none;transition:all .2s}
.ci .sw::after{content:"";position:absolute;top:2px;left:2px;width:12px;height:12px;border-radius:50%;background:#fff;transition:all .2s}
.ci.on .sw{background:var(--morado)}.ci.on .sw::after{left:16px}
.tot{display:flex;justify-content:space-between;align-items:center;margin-top:6px;padding-top:6px;border-top:1px dashed var(--borde);font-weight:800}
.tot b{font-size:19px;font-variant-numeric:tabular-nums}
.gauge{height:12px;border-radius:99px;background:#EEF1F6;overflow:hidden;margin-top:5px;position:relative}
.gauge i{display:block;height:100%;width:0;border-radius:99px;transition:width .6s,background .3s}
.gauge .lim{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--tinta)}
table.mx{width:100%;border-collapse:collapse;font-size:12.8px}
table.mx th{background:#F5F7FB;color:var(--suave);font-size:11.5px;padding:7px;text-align:left}
table.mx td{padding:7px;border-bottom:1px solid #F0F2F6}
.sc{display:flex;gap:3px}.sc i{width:14px;height:14px;border-radius:4px;background:#E6EAF0;transition:background .3s}
.sc i.f{background:var(--c)}
.refs{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
.ref{background:#fff;border:1px solid var(--borde);border-radius:14px;padding:10px;font-size:12.8px}
.ref .hd{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.ref .lg2{width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:17px;color:#fff;flex:none}
.stars{color:#E0A100;font-size:13px;letter-spacing:1px}
.phone{background:#ECE5DD;border-radius:16px;padding:10px;min-height:150px}
.bub{max-width:82%;background:#fff;border-radius:12px;padding:7px 10px;font-size:13px;margin-bottom:7px;box-shadow:0 1px 1px rgba(0,0,0,.08);animation:fd .35s}
.bub small{display:block;font-weight:700;color:var(--azul);font-size:11.5px}
.bub.me{margin-left:auto;background:#DCF8C6}
.gantt{display:grid;gap:5px;margin-top:4px}
.gr{display:grid;grid-template-columns:130px 1fr;gap:8px;align-items:center;font-size:12px;font-weight:600}
.gtrack{position:relative;height:20px;background:#F1F4F9;border-radius:6px}
.gbar{position:absolute;top:0;bottom:0;border-radius:6px;width:0;transition:width .6s ease;color:#fff;font-size:10.5px;font-weight:700;display:flex;align-items:center;padding-left:6px;white-space:nowrap;overflow:hidden}
.months{display:grid;grid-template-columns:130px repeat(6,1fr);font-size:10.5px;color:var(--suave);font-weight:700;gap:0}
.months span{text-align:center}
.count{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;background:radial-gradient(circle,#16294D,var(--noche));color:#fff;border-radius:14px;z-index:5}
.count .n{font-size:110px;font-weight:800;line-height:1;text-shadow:0 0 40px rgba(124,252,138,.7);animation:pz .9s}
@keyframes pz{from{transform:scale(1.8);opacity:0}to{transform:none;opacity:1}}
.golive{font-size:34px;font-weight:800;color:#7CFC8A;text-shadow:0 0 30px rgba(124,252,138,.8);animation:pz .8s}
@media (max-width:760px){.team,.refs{grid-template-columns:1fr}.chk,.costs{grid-template-columns:1fr}.gr,.months{grid-template-columns:90px 1fr}.months span:not(:first-child){display:none}}
</style>
</head>

<script>
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const app = $('#app');
let nombre = '', t0 = 0, tick = null, segundos = 0;
const esc = t => String(t).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const pesos = n => '$' + Math.round(n).toLocaleString('es-MX');
const fmt = s => String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0');
const sleep = ms => new Promise(r => setTimeout(r, ms));

/* ---------- sonido ---------- */
let ac;
function tono(f, d = .12, tipo = 'sine', v = .14, delay = 0) {
  try { ac = ac || new (window.AudioContext || window.webkitAudioContext)();
    const o = ac.createOscillator(), g = ac.createGain(); o.type = tipo; o.frequency.value = f; g.gain.value = v; o.connect(g); g.connect(ac.destination);
    const t = ac.currentTime + delay; o.start(t); g.gain.exponentialRampToValueAtTime(.0001, t + d); o.stop(t + d + .02); } catch (e) {}
}
const sOk = () => { tono(660); tono(880, .15, 'sine', .14, .1); };
const sErr = () => tono(220, .25, 'square', .07);
const sWin = () => [523, 659, 784, 1047, 1319].forEach((f, i) => tono(f, .22, 'triangle', .13, i * .11));
const sPing = () => { tono(1046, .08, 'sine', .1); tono(1568, .12, 'sine', .08, .07); };
const sWhoosh = () => { tono(300, .2, 'triangle', .05); tono(600, .15, 'triangle', .04, .08); };
const sClick = () => tono(520, .04, 'square', .04);
const sBeep = () => tono(880, .18, 'square', .06);
const sMsg = () => { tono(900, .05, 'sine', .08); tono(1200, .07, 'sine', .07, .06); };

/* ---------- confeti ---------- */
const cv = $('#conf'), cx = cv.getContext('2d'); let piezas = [];
function confeti(n = 190) {
  cv.width = innerWidth; cv.height = innerHeight;
  const cols = ['#07B708', '#F07B00', '#D6338A', '#0E9C94', '#7B2FD0', '#E0A100', '#2E7DD7'];
  const vacio = !piezas.length;
  for (let i = 0; i < n; i++) piezas.push({ x: Math.random() * cv.width, y: -20 - Math.random() * cv.height * .5, vx: (Math.random() - .5) * 3, vy: 2 + Math.random() * 4, r: Math.random() * 6, c: cols[i % cols.length], a: Math.random() * 6 });
  if (vacio) requestAnimationFrame(caer);
}
function caer() {
  cx.clearRect(0, 0, cv.width, cv.height);
  piezas.forEach(p => { p.x += p.vx; p.y += p.vy; p.a += .1; cx.save(); cx.translate(p.x, p.y); cx.rotate(p.a); cx.fillStyle = p.c; cx.fillRect(-4, -2, 8 + p.r, 4); cx.restore(); });
  piezas = piezas.filter(p => p.y < cv.height + 20);
  if (piezas.length) requestAnimationFrame(caer); else cx.clearRect(0, 0, cv.width, cv.height);
}

/* ---------- utilidades ---------- */
function verEl(el) {
  if (!el || !el.isConnected) return;
  const v = document.querySelector('.view');
  const r = el.getBoundingClientRect();
  if (v && v.contains(el) && getComputedStyle(v).overflowY !== 'visible') {
    const vr = v.getBoundingClientRect();
    if (r.bottom > vr.bottom) v.scrollBy({ top: r.bottom - vr.bottom + 12, behavior: 'smooth' });
    else if (r.top < vr.top) v.scrollBy({ top: r.top - vr.top - 12, behavior: 'smooth' });
  } else {
    if (r.bottom > innerHeight) window.scrollBy({ top: r.bottom - innerHeight + 16, behavior: 'smooth' });
    else if (r.top < 0) window.scrollBy({ top: r.top - 16, behavior: 'smooth' });
  }
}

function reloj() { segundos = Math.floor((Date.now() - t0) / 1000); $('#timer').textContent = '⏱️ ' + fmt(segundos); }
function toast(txt, color = '#07B708') {
  const d = document.createElement('div'); d.className = 'toast'; d.style.borderLeftColor = color; d.innerHTML = txt;
  const tc = $('#toasts'); tc.prepend(d); while (tc.children.length > 3) tc.lastChild.remove(); sPing();
  setTimeout(() => { d.classList.add('out'); setTimeout(() => d.remove(), 400); }, 3200);
}
function msg(el, tipo, txt) {
  el.className = 'msg ' + tipo;
  if (tipo === 'ojo') {
    const p = txt.split('<br>');
    el.innerHTML = `<b>✖ Revisa tu respuesta.</b><div class="why">Recuerda: ${p[0]}</div>` + (p.length > 1 ? `<div style="margin-top:5px">${p.slice(1).join('<br>')}</div>` : '');
    sErr(); const v = $('.view') || app; v.classList.remove('shake'); void v.offsetWidth; v.classList.add('shake');
  } else { el.innerHTML = txt; sOk(); }
  setTimeout(() => verEl(el), 60);
}
function contar(el, de, a, ms = 900, f = v => Math.round(v).toLocaleString('es-MX')) {
  const ini = performance.now();
  const paso = now => { const p = Math.min((now - ini) / ms, 1), e = 1 - Math.pow(1 - p, 3); if (!el.isConnected) return; el.textContent = f(de + (a - de) * e); if (p < 1) requestAnimationFrame(paso); };
  requestAnimationFrame(paso);
}
function elegir(cont, btn) {
  let v = null;
  $$('.opt', cont).forEach(b => b.onclick = () => { $$('.opt', cont).forEach(x => x.classList.remove('pick')); b.classList.add('pick'); v = b.dataset.i; btn.disabled = false; sClick(); });
  return () => v;
}
const guia = t => `<div class="guia">👉 <b>Qué hacer:</b> ${t}</div>`;
function siguiente(m, texto, boton, fn) { msg(m, 'bien', `${texto}<div class="row"><button class="btn" id="nx">${boton}</button></div>`); $('#nx').onclick = fn; }

/* ---------- pasos ---------- */
const PASOS = ['Crear el equipo', 'Evaluar necesidades', 'Priorizar logros', 'Definir presupuesto', 'Seleccionar el sistema', 'Verificar en otras empresas', 'Preparar al personal'];
function marcar(n) {
  $('#prog').style.width = (n / 8 * 100) + '%';
  $$('.nav[data-p]').forEach((el, i) => { el.classList.toggle('done', i < n); el.classList.toggle('on', i === n); el.classList.toggle('lock', i > n); el.querySelector('.num').textContent = i < n ? '✔' : i + 1; });
}
function mision(k, t, g) { $('#mi').innerHTML = `<div class="mk">${k}</div><h2>${t}</h2>${guia(g)}`; }
function vista(html, titulo, crumb) { const v = $('#vw'); v.classList.remove('fade'); void v.offsetWidth; v.classList.add('fade'); v.innerHTML = html; v.scrollTop = 0; if (titulo) $('#vt').textContent = titulo; if (crumb) $('#vc').textContent = crumb; }

/* ---------- login ---------- */
function inicio() {
  app.innerHTML = `
  <section class="login">
    <canvas id="net"></canvas>
    <div class="glass">
      <div class="brand"><div class="lg">◆</div>ValleProject</div>
      <p>Súper Del Valle debe elegir su ERP: la <b>propuesta A</b> (de propietario) o la <b>propuesta B</b> (de código abierto). Tú diriges el <b>comité de selección</b> y debes recorrer los <b>7 pasos</b> antes de firmar.</p>
      <div class="tip">👉 <b>Qué hacer:</b> escribe tu nombre completo y presiona <b>«Entrar al proyecto»</b>.</div>
      <label>Líder del comité</label>
      <input id="nom" maxlength="40" placeholder="Tu nombre completo" autocomplete="off">
      <button class="btn" id="go" disabled style="width:100%">Entrar al proyecto</button>
      <div class="loading" id="ld">
        <div class="ln"><b>✔</b> Abriendo expediente "Selección ERP 2026"…</div>
        <div class="ln"><b>✔</b> Cargando propuestas A y B…</div>
        <div class="ln"><b>✔</b> Preparando la sala del comité…</div>
        <div class="lbar"><i id="lb"></i></div>
      </div>
    </div>
  </section>`;
  red();
  const inp = $('#nom'), go = $('#go');
  inp.addEventListener('input', () => go.disabled = inp.value.trim().length < 3);
  inp.addEventListener('keydown', e => { if (e.key === 'Enter' && !go.disabled) go.click(); });
  go.onclick = async () => {
    nombre = inp.value.trim(); go.disabled = true; inp.disabled = true; sOk();
    $('#ld').style.display = 'block';
    const ls = $$('#ld .ln');
    for (let i = 0; i < ls.length; i++) { await sleep(380); ls[i].classList.add('in'); $('#lb').style.width = ((i + 1) / ls.length * 100) + '%'; sClick(); }
    await sleep(450);
    t0 = Date.now(); tick = setInterval(reloj, 500);
    shell(); paso1();
  };
}
function red() {
  const c = $('#net'); if (!c) return;
  const g = c.getContext('2d'); let W, H, pts;
  const r = c.getBoundingClientRect(); W = c.width = r.width; H = c.height = r.height;
  pts = Array.from({ length: 46 }, () => ({ x: Math.random() * W, y: Math.random() * H, vx: (Math.random() - .5) * .4, vy: (Math.random() - .5) * .4 }));
  const loop = () => {
    if (!c.isConnected) return;
    g.clearRect(0, 0, W, H);
    pts.forEach(p => { p.x += p.vx; p.y += p.vy; if (p.x < 0 || p.x > W) p.vx *= -1; if (p.y < 0 || p.y > H) p.vy *= -1; });
    for (let i = 0; i < pts.length; i++) for (let j = i + 1; j < pts.length; j++) {
      const a = pts[i], b = pts[j], d = Math.hypot(a.x - b.x, a.y - b.y);
      if (d < 130) { g.strokeStyle = `rgba(124,252,138,${(1 - d / 130) * .25})`; g.beginPath(); g.moveTo(a.x, a.y); g.lineTo(b.x, b.y); g.stroke(); }
    }
    pts.forEach(p => { g.fillStyle = 'rgba(160,200,255,.7)'; g.beginPath(); g.arc(p.x, p.y, 2, 0, 7); g.fill(); });
    requestAnimationFrame(loop);
  };
  loop();
}

      <div class="gantt">${F.map(f => `<div class="gr"><span>${f[0]}</span><div class="gtrack"><div class="gbar" style="left:${f[1] / 6 * 100}%;background:${f[3]}" data-w="${f[2] / 6 * 100}">${f[2]} m</div></div></div>`).join('')}</div>
    </div>
    <div class="kpis" style="margin-top:10px">
      <div class="kpi" style="--c:#07B708"><small>Duración</small><b>6 meses</b></div>
      <div class="kpi" style="--c:#E0A100"><small>Costo total</small><b>$1,250,000</b></div>
      <div class="kpi" style="--c:#2E7DD7"><small>Margen del presupuesto</small><b>$250,000</b></div>
      <div class="kpi" style="--c:#D6338A"><small>Personal capacitado</small><b>442</b></div>
    </div>
    <div class="row"><button class="btn" id="go" disabled>🚀 Encender ValleERP</button></div>`, 'Plan del proyecto', 'ValleProject · Gantt');
  const bars = $$('.gbar');
  for (const b of bars) { await sleep(230); b.style.width = b.dataset.w + '%'; sClick(); }
  await sleep(500); $('#go').disabled = false; sPing();
  $('#go').onclick = async () => {
    $('#go').disabled = true;
    const gp = $('#gp'); gp.style.minHeight = '240px';
    const ov = document.createElement('div'); ov.className = 'count'; gp.appendChild(ov);
    for (const n of [3, 2, 1]) { ov.innerHTML = `<div style="font-size:13px;letter-spacing:.2em;color:#9FB4D6">ARRANQUE EN</div><div class="n">${n}</div>`; sBeep(); await sleep(850); }
    ov.innerHTML = `<div class="golive">◆ ValleERP EN VIVO</div><div style="margin-top:8px;color:#C9D3E8">12 tiendas · 5 módulos · 442 usuarios conectados</div>`;
    sWin(); confeti(); toast('🚀 <b>ValleERP está en vivo</b> en las 12 tiendas');
    await sleep(1600);
    resultados();
  };
}

/* ---------- Resultados ---------- */
function resultados() {
  clearInterval(tick); reloj();
  $('#prog').style.width = '100%';
  mision('Resultados', 'El comité cumplió los 7 pasos', 'Revisa el resumen y presiona <b>«Ver mi certificado»</b>.');
  const R = [['1. Equipo', '4 áreas representadas'], ['2. Necesidades', '5 necesidades reales'], ['3. Prioridad', 'Inventario en tiempo real'], ['4. Presupuesto', '$1,250,000 de $1,500,000'], ['5. Selección', 'Propuesta B · 21/25 puntos'], ['6. Verificación', '3 empresas consultadas'], ['7. Personal', '442 empleados capacitados']];
  vista(`<div class="panel" style="margin-top:0"><div class="cmp">${R.map(r => `<div class="r" style="grid-template-columns:200px 1fr"><span><b>${r[0]}</b></span><span class="v">✔ ${r[1]}</span></div>`).join('')}</div></div>
    <div class="row"><button class="btn" id="nx">🏆 Ver mi certificado</button></div>`, 'Resumen del proyecto', 'ValleProject · Proyecto completado');
  $$('.cmp .v').forEach((v, i) => setTimeout(() => { v.classList.add('in'); sClick(); }, 200 + i * 200));
  $('#nx').onclick = certificado;
}

/* ---------- Certificado ---------- */
function certificado() {
  const fecha = new Date().toLocaleDateString('es-MX', { day: 'numeric', month: 'long', year: 'numeric' });
  const tiempo = fmt(segundos);
  const texto = `◆ ${nombre} dirigió el comité de selección del ERP de Súper Del Valle: 7 pasos completados y ValleERP en vivo en ${tiempo}. Semana 6 · Tecnología de información aplicada a las empresas · UTEL`;
  const url = location.href;
  mision('¡Felicidades!', 'Proyecto completado', 'Comparte tu certificado en el chat de la clase.');
  vista(`
    <div class="cert">
      <div style="font-size:38px">🏆</div>
      <div style="font-size:11px;font-weight:800;letter-spacing:.08em;color:var(--verde-d)">CERTIFICADO</div>
      <h2 style="margin:4px 0">Líder del comité de selección ERP</h2>
      <p style="margin:2px 0">Se otorga a</p>
      <div class="nm">${esc(nombre)}</div>
      <p style="margin:4px 0">por dirigir los 7 pasos para elegir el ERP de Súper Del Valle y llevar ValleERP a su arranque.</p>
      <div class="meta"><span>✅ 7 pasos</span><span>💰 Dentro del presupuesto</span><span>⏱️ ${tiempo}</span><span>📅 ${fecha}</span><span>Semana 6</span></div>
      <p style="margin:8px 0 0"><b>Docente: Dr. Armando Maravilla</b></p>
    </div>
    <div class="share">
      <a class="btn wa" target="_blank" rel="noopener" href="https://wa.me/?text=${encodeURIComponent(texto + ' ' + url)}">WhatsApp</a>
      <a class="btn fb" target="_blank" rel="noopener" href="https://www.facebook.com/sharer/sharer.php?u=${encodeURIComponent(url)}">Facebook</a>
      <a class="btn xx" target="_blank" rel="noopener" href="https://twitter.com/intent/tweet?text=${encodeURIComponent(texto)}&url=${encodeURIComponent(url)}">X</a>
      <button class="btn cp" id="cp">Copiar</button>
      <button class="btn st" id="st">Imagen para historias</button>
    </div>
    <div class="chat">💬 Comparte en el chat tu certificado y tu tiempo</div>
    <div class="row" style="justify-content:center"><button class="btn sec" id="re">Jugar de nuevo</button></div>`, 'Certificado', 'ValleProject · Proyecto completado');
  $('#cp').onclick = async () => { try { await navigator.clipboard.writeText(texto); $('#cp').textContent = '¡Copiado!'; } catch (e) { prompt('Copia este texto:', texto); } };
  $('#st').onclick = () => historia(tiempo, fecha);
  $('#re').onclick = () => location.reload();
}
function historia(tiempo, fecha) {
  const c = document.createElement('canvas'); c.width = 1080; c.height = 1920;
  const x = c.getContext('2d');
  const g = x.createLinearGradient(0, 0, 1080, 1920); g.addColorStop(0, '#1B1446'); g.addColorStop(1, '#0B5E3A');
  x.fillStyle = g; x.fillRect(0, 0, 1080, 1920);
  const cols = ['#07B708', '#F07B00', '#D6338A', '#0E9C94', '#7B2FD0', '#E0A100'];
  for (let i = 0; i < 90; i++) { x.fillStyle = cols[i % 6]; x.globalAlpha = .5; x.fillRect(Math.random() * 1080, Math.random() * 1920, 14, 6); }
  x.globalAlpha = 1; x.fillStyle = '#fff';
  if (x.roundRect) { x.beginPath(); x.roundRect(90, 380, 900, 1200, 50); x.fill(); } else x.fillRect(90, 380, 900, 1200);
  x.textAlign = 'center';
  x.font = '160px serif'; x.fillText('🏆', 540, 600);
  x.fillStyle = '#058A06'; x.font = '800 44px Poppins, sans-serif'; x.fillText('CERTIFICADO', 540, 700);
  x.fillStyle = '#1B2236'; x.font = '700 56px Poppins, sans-serif'; x.fillText('Líder del comité', 540, 790); x.fillText('de selección ERP', 540, 860);
  x.fillStyle = '#7B2FD0'; x.font = '800 64px Poppins, sans-serif'; x.fillText(nombre.length > 22 ? nombre.slice(0, 22) + '…' : nombre, 540, 990);
  x.fillStyle = '#1B2236'; x.font = '500 44px Poppins, sans-serif';
  x.fillText('✅ 7 pasos · 🚀 ValleERP en vivo', 540, 1100);
  x.fillText('⏱️ ' + tiempo + '   ·   Semana 6', 540, 1180); x.fillText(fecha, 540, 1250);
  x.font = '700 40px Poppins, sans-serif'; x.fillText('Docente: Dr. Armando Maravilla', 540, 1350);
  x.fillStyle = '#fff'; x.font = '700 50px Poppins, sans-serif'; x.fillText('ValleProject · UTEL', 540, 1700);
  const img = new Image(); img.onload = () => { x.drawImage(img, 540 - 180, 1390, 360, 144); const a = document.createElement('a'); a.download = 'certificado-semana6.png'; a.href = c.toDataURL('image/png'); a.click(); };
  img.src = document.querySelector('header img').src;
}

inicio();
</script>
